name: Validate reusable skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository structure
        run: python tools/validate_repository.py .
      - name: Audit reusable documentation
        run: python skills/mule-docs/scripts/audit_documentation.py .
      - name: Lint the installer
        run: shellcheck install/install.sh
      - name: Validate plugin and marketplace manifests
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
