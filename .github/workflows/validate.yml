name: Validate reusable skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository structure
        run: |
          python tools/generate_ecosystem.py --check
          python tools/validate_repository.py .
      - name: Audit reusable documentation
        run: python skills/mule-docs/scripts/audit_documentation.py .
      - name: Lint the installer
        run: shellcheck install/install.sh
      - name: Build the documentation site
        # --strict turns a broken cross-link, missing anchor, or page left out of
        # the nav into a failure here rather than a warning in the deploy run.
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
      - name: Validate marketplace manifest
        run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      - name: Validate plugin manifest
        # `plugin validate <dir>` only checks the marketplace when both files exist,
        # so the plugin manifest needs its own invocation.
        run: npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
