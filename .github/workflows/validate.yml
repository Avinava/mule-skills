name: Validate reusable skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository structure
        run: python scripts/validate_repository.py .
      - name: Audit reusable documentation
        run: python skills/document-mulesoft-project/scripts/audit_documentation.py .
