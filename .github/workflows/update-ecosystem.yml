name: Propose ecosystem pin update

on:
  repository_dispatch:
    types: [tool_release]
  workflow_dispatch:
    inputs:
      package:
        description: Package key (mule-lint, mule-build, or anypoint-connect)
        required: true
        type: string
      version:
        description: Exact stable semantic version
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ecosystem-update-${{ github.event.client_payload.package || inputs.package }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ github.event.client_payload.package || inputs.package }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wait for the released package
        id: registry
        shell: bash
        run: |
          package_key="${PACKAGE#@sfdxy/}"
          package_spec="@sfdxy/${package_key}@${VERSION}"
          published=""
          node_requirement=""
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "$package_spec" version 2>/dev/null || true)"
            node_requirement="$(npm view "$package_spec" engines.node 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ] && [ -n "$node_requirement" ]; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::$package_spec metadata was not visible after 6 registry checks"
              exit 1
            fi
            echo "$package_spec metadata is not visible yet; retrying in 10 seconds ($attempt/6)"
            sleep 10
          done
          test "$published" = "$VERSION"
          node_pattern='^>=[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$node_requirement" =~ $node_pattern ]]; then
            echo "::error::$package_spec has unsupported engines.node: $node_requirement"
            exit 1
          fi
          echo "node_requirement=$node_requirement" >> "$GITHUB_OUTPUT"
      - name: Update the allowlisted pin and generated files
        run: >-
          python tools/update_ecosystem.py "$PACKAGE" "$VERSION"
          --node "${{ steps.registry.outputs.node_requirement }}"
      - name: Validate the proposal
        run: |
          python tools/generate_ecosystem.py --check
          python -m unittest discover -s tests -v
          python tools/validate_repository.py .
      - name: Open a pull request
        run: |
          if git diff --quiet; then
            echo "The ecosystem already contains $PACKAGE@$VERSION"
            exit 0
          fi
          safe_package="${PACKAGE#@sfdxy/}"
          branch="automation/ecosystem-${safe_package}-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          fi
          git checkout -b "$branch"
          git add ecosystem.json .mcp.json install docs skills README.md
          git commit -m "chore(ecosystem): update ${safe_package} to ${VERSION}"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          existing_pr="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request: $existing_pr"
          else
            gh pr create \
              --title "chore(ecosystem): update ${safe_package} to ${VERSION}" \
              --body "Automated exact-pin update from a tool release. Generated host configuration and documentation were validated; maintainer review is still required." \
              --base main \
              --head "$branch"
          fi
