<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 300"
  width="960"
  height="300"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">mule-skills</title>
  <desc id="description">
    A Mule 4 integration hub connects code, documentation, AI agents, and
    operations workflows.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#10243d" />
      <stop offset="1" stop-color="#123b46" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="documentation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="operations" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="agents" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path
        d="M 48 0 L 0 0 0 48"
        fill="none"
        stroke="#dbeafe"
        stroke-opacity="0.035"
        stroke-width="1"
      />
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#020617"
        flood-opacity="0.55"
      />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="300" rx="24" fill="url(#background)" />
  <rect width="960" height="300" rx="24" fill="url(#grid)" />
  <path
    d="M610 0h350v300H500c120-74 85-220 110-300Z"
    fill="#38bdf8"
    opacity="0.035"
  />

  <g transform="translate(30 29)">
    <circle cx="0" cy="0" r="7" fill="#fb7185" />
    <circle cx="23" cy="0" r="7" fill="#fbbf24" />
    <circle cx="46" cy="0" r="7" fill="#34d399" />
  </g>

  <g transform="translate(176 155)">
    <g
      fill="none"
      stroke-linecap="round"
      stroke-width="2.5"
      opacity="0.72"
      filter="url(#glow)"
    >
      <path d="M-30-12-105-66" stroke="#fbbf24" stroke-dasharray="5 7" />
      <path d="M-38 12-118 42" stroke="#fb923c" stroke-dasharray="5 7" />
      <path d="M-10-38 4-91" stroke="#a78bfa" stroke-dasharray="5 7" />
      <path d="M34-14 112-60" stroke="#c084fc" stroke-dasharray="5 7" />
      <path d="M36 17 119 49" stroke="#34d399" stroke-dasharray="5 7" />
    </g>

    <g filter="url(#shadow)">
      <rect x="-134" y="-92" width="52" height="52" rx="15" fill="url(#code)" />
      <path
        d="m-116-76-8 10 8 10m17-20 8 10-8 10"
        fill="none"
        stroke="#fff"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="3"
      />

      <rect x="-144" y="18" width="48" height="48" rx="14" fill="url(#code)" />
      <path
        d="M-132 31h24m-24 9h18m-18 9h21"
        stroke="#fff"
        stroke-linecap="round"
        stroke-width="3"
      />

      <rect
        x="-22"
        y="-118"
        width="52"
        height="52"
        rx="15"
        fill="url(#documentation)"
      />
      <path
        d="M-8-105h17l8 8v19H-8Zm17 0v8h8M-1-90h11m-11 6h11"
        fill="none"
        stroke="#fff"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2.6"
      />

      <rect x="88" y="-86" width="52" height="52" rx="15" fill="url(#agents)" />
      <path
        d="m114-72 3.5 8.5 8.5 3.5-8.5 3.5-3.5 8.5-3.5-8.5-8.5-3.5 8.5-3.5Zm13 15 1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6Z"
        fill="#fff"
      />

      <rect
        x="96"
        y="25"
        width="52"
        height="52"
        rx="15"
        fill="url(#operations)"
      />
      <path
        d="M107 52h8l5-12 7 24 5-12h7"
        fill="none"
        stroke="#fff"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="3"
      />
    </g>

    <circle
      cx="0"
      cy="0"
      r="53"
      fill="#22d3ee"
      opacity="0.13"
      filter="url(#glow)"
    />
    <rect
      x="-40"
      y="-40"
      width="80"
      height="80"
      rx="22"
      fill="url(#core)"
      filter="url(#shadow)"
      transform="rotate(45)"
    />
    <circle cx="0" cy="0" r="27" fill="#082f49" opacity="0.35" />
    <text
      x="0"
      y="2"
      fill="#fff"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="19"
      font-weight="800"
      text-anchor="middle"
      dominant-baseline="middle"
    >
      M4
    </text>

    <g fill="#e0f2fe">
      <circle cx="-57" cy="-28" r="3" />
      <circle cx="51" cy="-40" r="3" />
      <circle cx="59" cy="31" r="3" />
    </g>
  </g>

  <g transform="translate(360 125)">
    <text
      x="0"
      y="0"
      fill="#fff"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="54"
      font-weight="800"
      letter-spacing="-1.5"
    >
      mule
      <tspan fill="#38bdf8">-skills</tspan>
    </text>
    <text
      x="2"
      y="48"
      fill="#a5c5d8"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="16"
      font-weight="700"
      letter-spacing="1.8"
    >
      DOCUMENT · DEVELOP · TROUBLESHOOT · OPERATE
    </text>
    <g transform="translate(2 75)">
      <rect
        width="390"
        height="34"
        rx="17"
        fill="#e0f2fe"
        opacity="0.08"
        stroke="#7dd3fc"
        stroke-opacity="0.18"
      />
      <circle cx="19" cy="17" r="5" fill="#34d399" />
      <text
        x="34"
        y="18"
        fill="#dbeafe"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="13"
        font-weight="600"
        dominant-baseline="middle"
      >
        EVIDENCE-BACKED MULE 4 AGENT WORKFLOWS
      </text>
    </g>
  </g>
</svg>
